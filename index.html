<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

        <!-- Reset CSS -->
        <link rel="stylesheet" href="./assets/css/reset.css" />

        <!-- Styles CSS -->
        <link rel="stylesheet" href="./assets/css/styles.css" />

        <title>Frontend Mentor | QR code component</title>
    </head>
    <body>
        <main>
            <div class="container">
                <article class="qr-card">
                    <div class="qr-card__top">
                        <div class="qr-card__bg">
                            <img class="qr-card__code" src="./assets/images/qr-code.svg" alt="https://www.frontendmentor.io/" />

                            <div class="circle circle--top"></div>
                            <div class="circle circle--bottom"></div>
                        </div>
                    </div>

                    <div class="qr-card__content">
                        <h1 class="qr-card__heading text-bold">Improve your front-end skills by building projects</h1>
                        <p class="qr-card__cta-text text-regular">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
                    </div>
                </article>
            </div>
        </main>

        <footer class="attribution text-bold">Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by <a href="https://www.frontendmentor.io/profile/DTKHOI">Tuan Khoi</a>.</footer>
    </body>
</html>
